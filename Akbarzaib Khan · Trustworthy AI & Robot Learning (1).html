<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fafaf7;--card:#fff;--tx:#1a1d23;--mut:#5f6673;--ac:#3b3fd8;--acs:#eceefd;--bd:#e4e4de;--ok:#157347;--oks:#e3f3ea;--wn:#9a5b00;--wns:#fdf0d8;--bl:#1d5fb4;--bls:#e1edfb;--gr:#555;--grs:#ececea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#171a21;--tx:#eceef2;--mut:#9aa3b2;--ac:#8b90ff;--acs:#23264a;--bd:#272b35;--ok:#6fd39b;--oks:#143023;--wn:#f0b560;--wns:#35290f;--bl:#7db3ff;--bls:#14263f;--gr:#b5bac4;--grs:#262a33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#171a21;--tx:#eceef2;--mut:#9aa3b2;--ac:#8b90ff;--acs:#23264a;--bd:#272b35;--ok:#6fd39b;--oks:#143023;--wn:#f0b560;--wns:#35290f;--bl:#7db3ff;--bls:#14263f;--gr:#b5bac4;--grs:#262a33;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);z-index:5}
nav div{max-width:980px;margin:0 auto;display:flex;gap:20px;padding:13px 22px;overflow-x:auto}
nav a{color:var(--mut);text-decoration:none;font-size:14px;white-space:nowrap}nav a:hover{color:var(--ac)}
main{max-width:980px;margin:0 auto;padding:0 22px 40px}
.hero{padding:72px 0 28px;background:radial-gradient(600px 220px at 0 0,var(--acs),transparent 70%)}
.hero .kick{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);font-weight:600;margin:0 0 12px}
.hero h1{font-size:clamp(38px,7vw,64px);line-height:1.05;margin:0 0 14px;font-weight:600;letter-spacing:-.01em}
.hero .tag{font-size:clamp(18px,2.6vw,22px);color:var(--mut);margin:0 0 18px}
.hero .about{max-width:700px;margin:0 0 20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.chip{font-size:13px;padding:4px 11px;border-radius:99px;background:var(--acs);color:var(--ac);font-weight:500}
.links{display:flex;flex-wrap:wrap;gap:10px}

.links a:hover{border-color:var(--ac)}
.aff{color:var(--mut);font-size:14px;margin-top:16px}
section{padding-top:56px}
h2{font-size:28px;margin:0 0 6px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sub{color:var(--mut);font-size:15px;margin:0 0 20px;max-width:680px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.card .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card h3{margin:0;font-size:18px;line-height:1.35;font-weight:600}
.badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;background:var(--grs);color:var(--gr)}
.badge.ok{background:var(--oks);color:var(--ok)}.badge.wn{background:var(--wns);color:var(--wn)}.badge.bl{background:var(--bls);color:var(--bl)}
.au{font-size:14px;color:var(--mut);margin:4px 0 0}.au b{color:var(--tx)}
.meta{color:var(--ac);font-size:13.5px;font-weight:600;margin:6px 0}
.card p.t{margin:6px 0 0;color:var(--mut);font-size:15px}
.card a.lnk{display:inline-block;margin-top:10px;font-size:14px;color:var(--ac);font-weight:500;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.grid .card{margin:0;padding:0;overflow:hidden;display:flex;flex-direction:column}
.grid .body{padding:14px 16px 16px}
.hero-img{position:relative;aspect-ratio:4/3;background:var(--grs);cursor:zoom-in}
.hero-img img{width:100%;height:100%;object-fit:cover;display:block}
.hero-img span{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:2px 8px;border-radius:99px}
.empty{color:var(--mut);font-style:italic}
button{font:inherit;font-size:14px;cursor:pointer;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.acts{margin-top:10px;display:flex;gap:8px}.grid .acts{padding:0 16px 14px;margin:0}
#bar{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6}
#modal:not(:empty){position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.box{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:500px;max-height:92%;overflow:auto}
.box label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
.box input,.box textarea{width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.lb{position:relative;max-width:100%;max-height:100%;display:flex;align-items:center;justify-content:center}
.lb img{max-width:100%;max-height:88vh;border-radius:10px}
.lb button{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.6);color:#fff;border:0;font-size:22px;padding:8px 14px}
.contact{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:26px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:36px 0}

<script id="data" type="application/json">{"profile": {"name": "Akbarzaib Khan", "tagline": "Trustworthy AI and robot learning", "about": "I study when learned systems can be trusted: detecting hidden behaviours acquired during LLM fine-tuning, helping robot policies recognise when not to act, and keeping safety certificates valid when dynamics change. I also build the hardware: rovers, motor rigs and control electronics.", "affiliation": "Electronic Engineering, Queen Mary University of London \u00b7 Algoverse AI Research", "interests": ["LLM safety & subliminal learning", "Uncertainty in robot learning", "Certifiable trajectory optimization", "Multi-robot trust", "Soft manipulation"], "links": {"email": "ec261065@qmul.ac.uk, akbarzaibkhan122@gmail.com, akbarzaibkhan122@outlook.com", "linkedin": "https://www.linkedin.com/in/akbarzaib-khan-16666022a/", "github": "https://github.com/akbarkhan123"}}, "papers": [{"title": "Liminal Training: Characterizing and Mitigating Subliminal Learning in Large Language Models", "meta": "NeurIPS 2025 Workshop on Socially Responsible and Trustworthy Foundation Models", "text": "Shows that subliminal trait acquisition in Qwen2.5 models happens as a sharp spike in the first 10\u201320 fine-tuning steps, and proposes an annealed KL regulariser that prevents it while keeping MMLU performance. My contributions: statistical analysis of the 'significant numbers' and the visualisations.", "link": "", "imgs": [], "authors": "Atsushi Yanagisawa, Akbarzaib Khan, Thanjeetraaj Kaur Balraj Singh, Yunjong Na, Kevin Zhu, Antonio Mari", "status": "Published"}, {"title": "LayerPlan: Controllable Instruction-Based Image Editing via Semantic Layer Decomposition and Dynamic Planning", "meta": "COLM 2026", "text": "A training-free pipeline that splits an image into RGBA layers, edits only the target layer and recomposites. On 100 MagicBrush samples it changes background pixels about 3\u00d7 less than Qwen-Image-Edit (median 7.5 vs 21.6) with a GPT-4o judge score of 9.20/10 for background preservation.", "link": "", "imgs": [], "authors": "Author list withheld during double-blind review", "status": "Under review"}, {"title": "Application of Machine Learning and Deep Learning for the Detection of Heart Disease", "meta": "Biomedical Journal of Scientific & Technical Research 60(2), January 2025", "text": "Compares SVM, logistic regression, KNN, XGBoost, random forest, decision tree, Na\u00efve Bayes, ANN and CNN on the Cleveland heart-disease dataset; a CNN with four convolutional layers performed best (95% accuracy).", "link": "https://doi.org/10.26717/BJSTR.2025.60.009439", "imgs": [], "authors": "Shahbano Khan, Jahanzeb Khan, Akbar Zaib Khan", "status": "Published"}], "current": [{"title": "LiminalGuard: Trait-Agnostic Early Detection of Subliminal Learning", "meta": "Progress report, 8 October 2026", "text": "Asks whether a subliminally learned trait can be detected from a model's internal representations before it appears in behaviour. In a Qwen2.5-3B number-carrier model organism, five dragon-trained runs were still behaviourally indistinguishable from neutral at step 10, yet displacement, spectral concentration and effective rank separated all five from the clean runs; behavioural onset came at step 20. A clean-only detector was then frozen and raised no alarms on five held-out neutral runs. Still to be shown: sensitivity on held-out contaminated runs and an online alarm before behavioural onset. Builds on Liminal Training.", "link": "", "imgs": [], "status": "Preliminary results"}, {"title": "CERT-ADAPT: Certifiable Online Trajectory Optimization Under Learned Dynamics Mismatch", "meta": "Research proposal draft", "text": "Certificates from a nominal model can become misleading after payload, friction or wear changes. CERT-ADAPT couples online model-mismatch detection with fast certifiable trajectory optimization: a calibrated uncertainty set is updated online, a robust polynomial (SDP/SOS) trajectory problem is re-solved only when evidence warrants it, and a learned warm start speeds up search but never acts as the safety certificate. Planned evaluation covers cartpole, planar pushing and mobile or aerial robots under controlled dynamics shifts. This is a proposal; no experimental results are claimed yet.", "link": "", "imgs": [], "status": "Proposal"}, {"title": "Knowing When Not to Act: Uncertainty-Aware Vision-Language-Action Models for Robust Manipulation (SAFE-VLA)", "meta": "Manuscript in preparation \u00b7 results to be added", "text": "Wraps a vision-language-action policy with calibrated uncertainty and a three-way gate (execute, replan or abstain) so a robot can recognise when its own action is unreliable under visual and physical distribution shift. Plans a benchmark of illumination, blur, occlusion, camera and clutter shifts, comparing softmax, entropy, MC-dropout, learned failure heads and conformal thresholds.", "link": "", "imgs": [], "status": "Draft"}, {"title": "PHYSTRUST: Joint Physical-Health and Communication Trust for Resilient Multi-Robot Coordination", "meta": "Research proposal draft", "text": "A distributed framework where each robot keeps separate but coupled beliefs about whether a neighbour can be trusted and how physically capable it is, so a degraded but honest robot is not treated like a malicious one. The joint belief feeds resilient consensus and task allocation, targeting formation, rendezvous and exploration with mixed cyber and physical failures.", "link": "", "imgs": [], "status": "Proposal"}, {"title": "SOFT-SENSE: Uncertainty-Aware Tactile Adaptation for Delicate Soft-Robotic Manipulation", "meta": "Research proposal draft", "text": "Co-designs a compliant soft gripper with embedded sensing. Low-force exploratory contact estimates an uncertain contact state (stiffness, friction, geometry), a mechanics model plus learned residual predicts force, and a safety supervisor reduces force, repositions or abstains when uncertainty is too <script>
const D=JSON.parse(document.getElementById('data').textContent);
const SEC=[['papers','Publications','Peer-reviewed and under-review work.','Add publication','card'],['current','Work in progress','Ongoing projects. Status labels show how far each one has got; proposals report no results.','Add project','card'],['robotics','Robotics','Hands-on builds in mechanics, electronics and control.','Add build','grid'],['events','Leadership & community','Events and societies I help run.','Add event','grid']];
const LK=[['email','Email'],['cv','CV'],['scholar','Google Scholar'],['github','GitHub'],['linkedin','LinkedIn']];
let owner=false,art=null,edit=false,lb=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//i.test(u)?u:'';
const href=(k,v)=>k==='email'?'mailto:'+v.replace(/^mailto:/,''):safe(v);
const bcls=s=>/^published/i.test(s)?'ok':/review/i.test(s)?'wn':/prelim/i.test(s)?'bl':'';
const authors=a=>esc(a).replace(/(Akbar ?[Zz]aib Khan|Akbarzaib Khan)/g,'<b>$1</b>');
function card(k,it,i,grid){
  const im=it.imgs&&it.imgs.length?`<div class="hero-img" onclick="open_('${k}',${i},0)"><img src="${it.imgs[0]}" alt="">${it.imgs.length>1?`<span>${it.imgs.length} photos</span>`:''}</div>`:'';
  const body=`${grid?'':`<div class="top"><h3 class="serif">${esc(it.title)}</h3>${it.status?`<span class="badge ${bcls(it.status)}">${esc(it.status)}</span>`:''}</div>`}${grid?`<h3 class="serif">${esc(it.title)}</h3>`:''}${it.authors?`<div class="au">${authors(it.authors)}</div>`:''}${it.meta?`<div class="meta">${esc(it.meta)}</div>`:''}<p class="t">${esc(it.text)}</p>${safe(it.link)?`<a class="lnk" href="${esc(safe(it.link))}" target="_blank" rel="noopener">Read paper →</a>`:''}`;
  const acts=edit?`<div class="acts"><button onclick="editItem('${k}',${i})">Edit</button><button onclick="del('${k}',${i})">Delete</button></div>`:'';
  return grid?`<div class="card">${im}<div class="body">${body}</div>${acts}</div>`:`<div class="card">${body}${acts}</div>`;
}
function render(){
  const p=D.profile,L=p.links||{};
  const links=LK.filter(([k])=>L[k]).flatMap(([k,l])=>k==='email'?L[k].split(',').map(e=>e.trim()).filter(Boolean).map((e,n)=>`<a class="${n?'':'p'}" href="mailto:${esc(e)}">${esc(e)}</a>`):[`<a href="${esc(href(k,L[k]))}" target="_blank" rel="noopener">${l}</a>`]).join('');
  let h=`<div class="hero" id="top"><p class="kick">Research portfolio</p><h1 class="serif">${esc(p.name)}</h1><p class="tag">${esc(p.tagline)}</p><p class="about">${esc(p.about)}</p><div class="chips">${(p.interests||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><div class="links">${links}</div><div class="aff">${esc(p.affiliation)}</div>${edit?'<div class="acts"><button onclick="editProfile()">Edit profile & links</button></div>':''}</div>`;
  for(const [k,t,sub,add,kind] of SEC){
    const g=kind==='grid';
    h+=`<section id="${k}"><h2 class="serif">${t}${edit?`<button class="pri" onclick="editItem('${k}',-1)">+ ${add}</button>`:''}</h2><p class="sub">${sub}</p>`;
    const items=D[k].map((it,i)=>card(k,it,i,g)).join('');
    h+=D[k].length?(g?`<div class="grid">${items}</div>`:items):'<p class="empty">Nothing here yet.</p>';
    h+='</section>';
  }
  h+=`<section id="contact"><h2 class="serif">Contact</h2><div class="contact"><p style="margin:0 0 14px">${L.email?'Happy to discuss research, collaborations or projects.':'Contact details coming soon.'}</p><div class="links">${links}</div></div></section><footer>© ${esc(p.name)}</footer>`;
  $('#app').innerHTML=h;
  $('#bar').innerHTML=owner?`<button class="pri" onclick="edit=!edit;render()">${edit?'Done editing':'✎ Edit site'}</button>`:'';
}
function open_(k,i,j){lb={k,i,j};showLB()}
function showLB(){
  const a=D[lb.k][lb.i].imgs,n=a.length;
  $('#modal').innerHTML=`<div class="lb"><img src="${a[lb.j]}" alt="">${n>1?'<button style="left:8px" onclick="event.stopPropagation();step(-1)">‹</button><button style="right:8px" onclick="event.stopPropagation();step(1)">›</button>':''}</div>`;
  $('#modal').onclick=()=>{$('#modal').innerHTML='';$('#modal').onclick=null;lb=null};
}
function step(d){const n=D[lb.k][lb.i].imgs.length;lb.j=(lb.j+d+n)%n;showLB()}
document.addEventListener('keydown',e=>{if(!lb)return;if(e.key==='Escape')$('#modal').click();if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});
function modal(title,fields,vals,onSave){
  $('#modal').onclick=null;
  $('#modal').innerHTML=`<div class="box"><h3 style="margin:0">${title}</h3>${fields.map(([k,l,ta])=>`<label>${l}${ta?`<textarea id="f_${k}" rows="4">${esc(vals[k])}</textarea>`:`<input id="f_${k}" value="${esc(vals[k])}">`}</label>`).join('')}<div class="acts" style="margin-top:16px"><button class="pri" id="sv">Save</button><button id="cx">Cancel</button></div></div>`;
  $('#cx').onclick=()=>$('#modal').innerHTML='';
  $('#sv').onclick=()=>{const o={};fields.forEach(([k])=>o[k]=$('#f_'+k).value.trim());onSave(o)};
}
function editItem(k,i){
  const cur=i>=0?D[k][i]:{title:'',authors:'',meta:'',status:'',text:'',link:'',imgs:[]};
  modal(i>=0?'Edit':'Add',[['title','Title'],['authors','Authors (optional)'],['meta','Venue / date / role'],['status','Status badge (Published, Under review, Preliminary results, Proposal…)'],['text','Description',1],['link','Link (https://…, optional)']],cur,o=>{if(!o.title)return;o.imgs=cur.imgs||[];i>=0?D[k][i]=o:D[k].unshift(o);save()});
}
function editProfile(){
  const p=D.profile,L=p.links||{};
  const v={name:p.name,tagline:p.tagline,about:p.about,affiliation:p.affiliation,interests:(p.interests||[]).join(', '),...L};
  modal('Edit profile & links',[['name','Name'],['tagline','Tagline'],['about','About',1],['affiliation','Affiliation line'],['interests','Research interests (comma-separated)'],['email','Email'],['cv','CV link (https://…)'],['scholar','Google Scholar URL'],['github','GitHub URL'],['linkedin','LinkedIn URL']],v,o=>{
    p.name=o.name;p.tagline=o.tagline;p.about=o.about;p.affiliation=o.affiliation;p.interests=o.interests.split(',').map(s=>s.trim()).filter(Boolean);
    p.links={};['email','cv','scholar','github','linkedin'].forEach(k=>{if(o[k])p.links[k]=o[k]});save()});
}
function del(k,i){if(confirm('Delete this item?')){D[k].splice(i,1);save()}}
async function save(){
  if(!art){alert('Saving is only available when you are signed in as the page owner.');return}
  try{
    const c=document.documentElement.cloneNode(true);
    c.querySelector('#app').innerHTML='';c.querySelector('#bar').innerHTML='';c.querySelector('#modal').innerHTML='';
    c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
    await art.publish('<!doctype html>\n'+c.outerHTML);
  }catch(e){alert('Could not save: '+(e&&e.message||e))}
}
render();
if(window.claude&&claude.use){
  claude.use('user').then(u=>{owner=u?u.isOwner():false;render()}).catch(()=>{});
  claude.use('artifact').then(a=>{art=a}).catch(()=>{});
}
</script></body></html>
